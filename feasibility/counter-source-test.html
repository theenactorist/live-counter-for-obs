<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Counter Feasibility Test</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #1a1a2e; color: #eee; padding: 16px; font-size: 13px; }
  h3 { margin: 0 0 8px; color: #7fdbca; }
  .ok { color: #6fe37f; } .fail { color: #ff7b72; } .pend { color: #f0c674; }
  #log { white-space: pre-wrap; font-family: monospace; font-size: 11px; margin-top: 8px; opacity: .8; }
</style>
</head>
<body>
<h3>Counter feasibility probe</h3>
<div id="status"></div>
<div id="log"></div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var role = params.get('role') || (location.pathname.indexOf('source') >= 0 ? 'source' : 'dock');
  var state = {
    role: role,
    loads: 0,
    localStorage: 'fail',
    secureContext: !!window.isSecureContext,
    subtleCrypto: !!(window.crypto && window.crypto.subtle),
    obsstudio: !!window.obsstudio,
    obsPluginVersion: (window.obsstudio && window.obsstudio.pluginVersion) || null,
    controlLevel: null,
    seenOther: [],
    sawLua: false,
    sawFallback: false
  };

  try {
    var k = 'claude_feas_' + role;
    var n = (parseInt(localStorage.getItem(k) || '0', 10) + 1);
    localStorage.setItem(k, String(n));
    state.loads = n;
    state.localStorage = 'ok';
  } catch (e) { state.localStorage = 'fail:' + e.message; }

  if (window.obsstudio && window.obsstudio.getControlLevel) {
    try { window.obsstudio.getControlLevel(function (l) { state.controlLevel = l; render(); }); } catch (e) {}
  }

  var logEl = document.getElementById('log');
  function log(m) { logEl.textContent += m + '\n'; }
  function render() {
    document.getElementById('status').innerHTML =
      'role: <b>' + role + '</b> · loads: ' + state.loads +
      ' · localStorage: <span class="' + (state.localStorage === 'ok' ? 'ok' : 'fail') + '">' + state.localStorage + '</span>' +
      ' · obsstudio: ' + state.obsstudio + ' · ws: <span id="wss" class="pend">connecting</span>';
  }
  render();

  var ws = null, identified = false, ridN = 0, helloTimer = null;
  function rid() { return role + '-' + (++ridN); }

  function send(requestType, requestData) {
    if (!identified) return;
    ws.send(JSON.stringify({ op: 6, d: { requestType: requestType, requestId: rid(), requestData: requestData } }));
  }
  function broadcast(eventData) { send('BroadcastCustomEvent', { eventData: eventData }); }

  function connect() {
    ws = new WebSocket('ws://127.0.0.1:4455');
    ws.onopen = function () { log('ws open'); };
    ws.onclose = function () {
      identified = false;
      if (helloTimer) { clearInterval(helloTimer); helloTimer = null; }
      document.getElementById('wss') && (document.getElementById('wss').textContent = 'reconnecting');
      setTimeout(connect, 2000);
    };
    ws.onerror = function () {};
    ws.onmessage = function (ev) {
      var msg = JSON.parse(ev.data);
      if (msg.op === 0) { // Hello (auth disabled for the probe)
        ws.send(JSON.stringify({ op: 1, d: { rpcVersion: 1, eventSubscriptions: 1023 } }));
      } else if (msg.op === 2) { // Identified
        identified = true;
        var el = document.getElementById('wss');
        if (el) { el.textContent = 'connected'; el.className = 'ok'; }
        log('identified');
        send('SetPersistentData', {
          realm: 'OBS_WEBSOCKET_DATA_REALM_GLOBAL',
          slotName: 'claude_feas_' + role,
          slotValue: { loads: state.loads, savedAt: new Date().toISOString() }
        });
        if (helloTimer) clearInterval(helloTimer);
        helloTimer = setInterval(function () { broadcast({ source: 'page', role: role, state: state }); }, 3000);
        broadcast({ source: 'page', role: role, state: state });
      } else if (msg.op === 5) { // Event
        var t = msg.d.eventType, d = msg.d.eventData || {};
        if (t === 'CustomEvent' && d.source === 'page' && d.role && d.role !== role) {
          if (state.seenOther.indexOf(d.role) < 0) {
            state.seenOther.push(d.role);
            broadcast({ source: 'page-ack', role: role, saw: d.role });
            log('saw other page: ' + d.role);
          }
        } else if (t === 'CustomEvent' && d.source === 'lua-bridge') {
          if (!state.sawLua) { state.sawLua = true; broadcast({ source: 'page-saw-lua', role: role }); log('saw lua bridge event'); }
        } else if (t === 'InputSettingsChanged' && d.inputName === 'ClaudeCommandChannel') {
          if (!state.sawFallback) { state.sawFallback = true; broadcast({ source: 'page-saw-fallback', role: role, text: (d.inputSettings || {}).text }); log('saw fallback settings change'); }
        }
        render();
      }
    };
  }
  connect();
})();
</script>
</body>
</html>
