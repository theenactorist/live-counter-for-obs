<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Counter — Dock</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #121212;
        color: #e8e8e8;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
      }
      #app {
        min-height: 100vh;
      }
      [hidden] {
        display: none !important;
      }
      .banner {
        padding: 0.6rem 1rem;
        font-size: 0.9rem;
      }
      .banner-warn {
        background: #4a2f00;
        color: #ffd699;
        border-bottom: 1px solid #7a4d00;
      }
      .banner-info {
        background: #123a52;
        color: #b3ddff;
        border-bottom: 1px solid #1f6491;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      .settings-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        padding: 0.5rem 1rem;
        background: #1a1a1a;
        border-bottom: 1px solid #2a2a2a;
        font-size: 0.85rem;
      }
      .settings-row label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }
      .settings-row input {
        background: #0f0f0f;
        color: #e8e8e8;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
        padding: 0.35rem 0.5rem;
        min-height: 32px;
        width: 6.5rem;
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid #2a2a2a;
      }
      .tabs button {
        flex: 1;
        min-height: 44px;
        background: #1a1a1a;
        color: #e8e8e8;
        border: none;
        border-bottom: 3px solid transparent;
        font-size: 1rem;
        cursor: pointer;
      }
      .tabs button.active {
        border-bottom-color: #4da3ff;
        background: #202020;
        font-weight: 700;
      }
      .pane {
        padding: 1rem;
      }
      .live-empty {
        padding: 2rem 1rem;
        color: #a0a0a0;
        font-size: 1.1rem;
      }
      .live-empty button.ctl {
        margin-top: 0.75rem;
      }
      /* Task 2.12 — one-card connect flow. Mirrors .settings-row's own
         input/label styling (Diagnostics' Settings section) so the two
         forms that persist through the SAME onSaveSettings path also look
         like the same feature. */
      .connect-card {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        align-items: flex-start;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        padding: 0.9rem;
        margin-top: 0.5rem;
      }
      .connect-card label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }
      .connect-card input {
        background: #0f0f0f;
        color: #e8e8e8;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
        padding: 0.35rem 0.5rem;
        min-height: 40px;
        width: 10rem;
      }
      .connect-state {
        color: #ffd699;
        font-size: 0.9rem;
      }
      /* Gate fix wave (Ruling C) — the card is no longer a wall: this line
         names what connecting actually buys, and the chip below is the
         permanent way back once "Not now" has been clicked. */
      .connect-optional-note {
        color: #a0a0a0;
        font-size: 0.85rem;
        max-width: 34rem;
      }
      button.ctl.obs-chip {
        min-height: 28px;
        min-width: 0;
        padding: 0.2rem 0.7rem;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        border-radius: 999px;
        background: #2a2a2a;
        color: #c0c0c0;
        border: 1px solid #444;
        margin-bottom: 0.6rem;
      }
      /* Gate fix wave — secondary explanatory line under a control (the
         add-overlay scan's "already exists in <scene>" note, and the
         password-free-URL note beside it). */
      .diag-note {
        color: #a0a0a0;
        font-size: 0.85rem;
        margin: 0.35rem 0;
      }
      .current-value {
        font-size: clamp(2.5rem, 14vw, 5rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
        margin: 0.25rem 0;
      }
      .progress-line {
        color: #b0b0b0;
        font-size: 0.95rem;
        margin-bottom: 0.5rem;
      }
      .status-chip {
        display: inline-block;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        margin-bottom: 0.75rem;
      }
      .status-chip[data-state='showing'] {
        background: #123a1f;
        color: #7be495;
        border: 1px solid #1f6b39;
      }
      .status-chip[data-state='hidden'] {
        background: #3a1212;
        color: #ff9a9a;
        border: 1px solid #6b1f1f;
      }
      .status-chip[data-state='unknown'] {
        background: #2a2a2a;
        color: #c0c0c0;
        border: 1px solid #444;
      }
      .action-feedback {
        min-height: 1.2rem;
        color: #7be495;
        font-size: 0.9rem;
        margin-bottom: 0.75rem;
      }
      .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }
      button.ctl {
        min-height: 44px;
        min-width: 44px;
        padding: 0.5rem 0.9rem;
        font-size: 1rem;
        background: #2a2a2a;
        color: #e8e8e8;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        cursor: pointer;
      }
      button.ctl:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button.ctl.danger {
        border-color: #6b1f1f;
      }
      /* Task 2.10 — live-view hierarchy (PRD §9, AC 23): +1/-1 get their own
         row so +1 can visually outweigh -1 (larger flex share AND a taller
         min-height — both dimensions, so the bounding-box AREA test is never
         a coin flip on one axis alone), and Reset/End get a visibly smaller,
         muted treatment so they read as separate from the operator's
         moment-to-moment counting actions. */
      .primary-row {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }
      .primary-row .ctl-primary {
        flex: 1 1 0%;
        min-height: 56px;
        font-size: 1.15rem;
        font-weight: 700;
      }
      .primary-row .ctl-primary-dominant {
        flex: 2 1 0%;
        min-height: 72px;
        font-size: 1.5rem;
      }
      .live-danger-divider {
        height: 1px;
        background: #2a2a2a;
        border: none;
        margin: 0.9rem 0 0.6rem;
      }
      .danger-row .ctl-small {
        padding: 0.3rem 0.6rem;
        font-size: 0.8rem;
        opacity: 0.75;
      }
      .jump-box,
      .confirm-box {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        padding: 0.6rem;
        margin-bottom: 0.75rem;
      }
      .jump-box input {
        background: #0f0f0f;
        color: #e8e8e8;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
        padding: 0.35rem 0.5rem;
        min-height: 32px;
        width: 6rem;
        font-size: 1rem;
      }
      .jump-error {
        color: #ff9a9a;
        font-size: 0.85rem;
        width: 100%;
      }
      .mode-row {
        margin-bottom: 0.75rem;
      }
      .auto-cluster {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
      }
      /* Task 2.6 — Setup + Presets views */
      .form-row {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        margin-bottom: 0.6rem;
      }
      /* Task 2.14 — Setup redesign: <fieldset>/<legend> groups (Counter,
         Layout, Label, Counter style, Animation, Completion) with a visible
         heading each, replacing the earlier flat field list. Reset to a
         plain block (no default fieldset border/padding/min-width — a
         default <fieldset>'s intrinsic min-width can force horizontal
         overflow at the 300 px dock width all on its own) and restyled to
         match the rest of the dark UI. */
      .setup-group {
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        margin: 0 0 0.9rem;
        padding: 0.75rem;
        min-width: 0;
      }
      .setup-group-legend {
        padding: 0 0.3rem;
        font-size: 0.8rem;
        color: #a0a0a0;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      /* PRD §9 item 2 — Start/Finish on one row, two columns. `min-width: 0`
         on each column lets a flex child shrink below its content's natural
         width instead of forcing the row (and the 300 px dock) to overflow. */
      .two-col-row {
        display: flex;
        gap: 0.5rem;
      }
      .two-col-row > .form-row {
        flex: 1 1 0%;
        min-width: 0;
      }
      .form-label {
        font-size: 0.8rem;
        color: #a0a0a0;
      }
      .form-row input[type='text'],
      .form-row input[type='number'],
      .form-row input[type='search'],
      .form-row select {
        background: #0f0f0f;
        color: #e8e8e8;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
        padding: 0.4rem 0.5rem;
        min-height: 40px;
        font-size: 1rem;
        max-width: 100%;
      }
      .form-row input[type='color'] {
        min-height: 40px;
        width: 4rem;
        padding: 0.15rem;
        background: #0f0f0f;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
      }
      .field-error {
        color: #ff9a9a;
        font-size: 0.85rem;
      }
      .field-hint {
        color: #a0a0a0;
        font-size: 0.85rem;
        margin-bottom: 0.6rem;
      }
      .range-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .range-value {
        font-size: 0.85rem;
        color: #a0a0a0;
        min-width: 4.5rem;
      }
      .setup-preview-wrap {
        background: #0f0f0f;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        padding: 1rem;
        margin-bottom: 0.75rem;
      }
      .setup-preview {
        font-variant-numeric: tabular-nums;
        margin-bottom: 0.6rem;
        word-break: break-word;
        display: inline-flex;
      }
      /* Task 2.14 — the preview's own layout (flex-direction/align-items,
         position/order/z-index for the textBehind ghost) is now applied
         INLINE by ../../shared/overlay-presentation.js's applyPresentation
         (the same function the real overlay renderer calls), not by
         per-layout CSS classes here — see setup.ts's renderPreviewBlock().
         '.setup-preview-ghost' survives purely as a TEST-identification
         marker (setup.ts's updatePreviewTestids toggles it on the ghost
         node so existing specs can assert on it); it carries no properties
         of its own so it can never fight the inline styles the shared
         module already applied to the exact same element. */
      .setup-preview-ghost {
      }
      /* Task 2.11 — six-layout gallery */
      .layout-gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }
      .layout-thumb-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.3rem;
        background: #1a1a1a;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.5rem 0.6rem;
        min-width: 64px;
        min-height: 64px;
        cursor: pointer;
        color: #e8e8e8;
      }
      .layout-thumb-btn.selected {
        border-color: #4da3ff;
        background: #123a52;
      }
      .layout-thumb {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        width: 40px;
        height: 28px;
        position: relative;
      }
      .layout-thumb-row {
        flex-direction: row;
      }
      .layout-thumb-column {
        flex-direction: column;
      }
      .layout-thumb-overlap {
        display: block;
      }
      .layout-thumb-overlap .layout-thumb-bar-number {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .layout-thumb-bar {
        background: #6ab0ff;
        border-radius: 2px;
      }
      .layout-thumb-bar-label {
        width: 14px;
        height: 5px;
      }
      .layout-thumb-bar-number {
        width: 20px;
        height: 12px;
      }
      .layout-thumb-bar-ghost {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 32px;
        height: 22px;
        opacity: 0.35;
      }
      .layout-thumb-caption {
        font-size: 0.7rem;
        color: #a0a0a0;
        text-align: center;
      }
      .list-header {
        margin-bottom: 0.75rem;
      }
      .list-header input {
        width: 100%;
        background: #0f0f0f;
        color: #e8e8e8;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
        padding: 0.4rem 0.5rem;
        min-height: 40px;
      }
      .list-row {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        padding: 0.75rem;
        margin-bottom: 0.6rem;
      }
      .list-row-title {
        font-weight: 700;
        font-size: 1.05rem;
      }
      .list-row-desc {
        color: #b0b0b0;
        font-size: 0.9rem;
        margin: 0.15rem 0;
      }
      .list-row-meta {
        color: #808080;
        font-size: 0.8rem;
        margin-bottom: 0.5rem;
      }
      /* Task 2.9 — preset export/import via clipboard */
      .import-panel {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        padding: 0.6rem;
        margin-bottom: 0.75rem;
      }
      /* Task 2.10, item 4 — wraps the textarea + its Paste button so Paste
         sits directly beside the field it fills, per the brief. Higher
         specificity than the plain `.import-panel textarea` rule below (3
         classes vs. 2), so its `width: auto` reliably wins regardless of
         declaration order. */
      .import-textarea-row {
        display: flex;
        gap: 0.5rem;
        align-items: flex-start;
      }
      .import-panel .import-textarea-row textarea {
        flex: 1 1 0%;
        min-width: 0;
        width: auto;
      }
      .import-panel textarea {
        background: #0f0f0f;
        color: #e8e8e8;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
        padding: 0.5rem;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        min-height: 8rem;
        resize: vertical;
        width: 100%;
      }
      /* Task 2.8 — Diagnostics view */
      .diag-section-title {
        font-size: 0.8rem;
        color: #a0a0a0;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0.9rem 0 0.4rem;
      }
      .diag-section-title:first-child {
        margin-top: 0;
      }
      .diag-checklist {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .diag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: baseline;
        padding: 0.5rem 0.6rem;
        border-radius: 6px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        font-size: 0.9rem;
      }
      .diag-row-label {
        font-weight: 700;
        min-width: 7rem;
      }
      .diag-row[data-state='ok'] {
        border-color: #1f6b39;
      }
      .diag-row[data-state='ok'] .diag-row-text {
        color: #7be495;
      }
      .diag-row[data-state='warn'] {
        border-color: #7a4d00;
      }
      .diag-row[data-state='warn'] .diag-row-text {
        color: #ffd699;
      }
      .diag-row[data-state='fail'] {
        border-color: #6b1f1f;
      }
      .diag-row[data-state='fail'] .diag-row-text {
        color: #ff9a9a;
      }
      /* Deliberately distinct from 'ok' green — a placeholder that hasn't
         actually been verified (e.g. diag-row-hotkeys) must never read as
         a success state. Matches .status-chip[data-state='unknown']'s own
         neutral gray. */
      .diag-row[data-state='neutral'] {
        border-color: #444;
      }
      .diag-row[data-state='neutral'] .diag-row-text {
        color: #c0c0c0;
      }
      .diag-url-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.5rem;
      }
      .diag-url-row input {
        flex: 1;
        min-width: 12rem;
        background: #0f0f0f;
        color: #e8e8e8;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
        padding: 0.4rem 0.5rem;
        min-height: 40px;
        font-size: 0.85rem;
      }
      .copy-confirm {
        color: #7be495;
        font-size: 0.85rem;
      }
      .diag-log {
        max-height: 16rem;
        overflow-y: auto;
        background: #0f0f0f;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        padding: 0.5rem;
        font-family: ui-monospace, monospace;
        font-size: 0.78rem;
        margin-bottom: 0.6rem;
      }
      .diag-log-line {
        padding: 0.1rem 0;
        border-bottom: 1px solid #1e1e1e;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div data-testid="app-shell">
        <div data-testid="banner-ws" class="banner banner-warn" hidden></div>
        <div class="tabs">
          <button data-testid="tab-presets">Presets</button>
          <button data-testid="tab-setup">Setup</button>
          <button data-testid="tab-live" class="active">Live</button>
          <button data-testid="tab-diagnostics">Diagnostics</button>
        </div>
        <div data-testid="pane-presets" class="pane" hidden></div>
        <div data-testid="pane-setup" class="pane" hidden></div>
        <div data-testid="pane-live" class="pane"></div>
        <div data-testid="pane-diagnostics" class="pane" hidden></div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
