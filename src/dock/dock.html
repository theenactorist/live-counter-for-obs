<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Counter — Dock</title>
    <style>
      :root {
        color-scheme: dark;
        /* Task 2.15 — kept in sync with the tab bar's REAL measured height
           by main.ts (a ResizeObserver on `.tabs`, since narrow widths can
           wrap a tab label onto two lines and grow past this fallback);
           this value only matters before that first measurement lands. */
        --tab-bar-height: 44px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #121212;
        color: #e8e8e8;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      /* Task 2.15 fix (debugged live): `overflow-x: hidden` used to sit on
         BOTH `html` and `body`. Per the CSS Overflow spec, an element whose
         `overflow-x` is anything but `visible` forces its OWN `overflow-y`
         (left unset above) to compute to `auto` rather than `visible` — so
         `body` was ALSO quietly becoming its own scroll container, even
         though it never actually needs to scroll (it has no explicit
         height; it just grows to fit `#app`). Because `body` sits CLOSER
         to `.tabs` in the ancestor chain than `html`, `position: sticky`
         resolved its containing scrollport against `body` instead of the
         real one (`html`/`document.scrollingElement`, confirmed via
         `documentElement.scrollHeight` vs. `clientHeight`) — a scrollport
         that never scrolls, so nothing ever stuck; `.tabs` just slid off
         with the rest of the page. Confining the rule to `html` alone
         keeps the exact same "no horizontal scrollbar on the document"
         behavior (the 300 px-width tests below already assert against
         `document.documentElement`, i.e. `html`, specifically) while
         leaving `body` out of the scroll-container business entirely, so
         `position: sticky` on `.tabs`/`.setup-preview-section` now
         resolves against the one real scrolling element. */
      html {
        overflow-x: hidden;
      }
      #app {
        min-height: 100vh;
      }
      [hidden] {
        display: none !important;
      }
      .banner {
        padding: 0.6rem 1rem;
        font-size: 0.9rem;
      }
      .banner-warn {
        background: #4a2f00;
        color: #ffd699;
        border-bottom: 1px solid #7a4d00;
      }
      .banner-info {
        background: #123a52;
        color: #b3ddff;
        border-bottom: 1px solid #1f6491;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      .settings-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        padding: 0.5rem 1rem;
        background: #1a1a1a;
        border-bottom: 1px solid #2a2a2a;
        font-size: 0.85rem;
      }
      .settings-row label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }
      .settings-row input {
        background: #0f0f0f;
        color: #e8e8e8;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
        padding: 0.35rem 0.5rem;
        min-height: 32px;
        width: 6.5rem;
      }
      /* Task 2.15 (operator feedback: "PLEASE FIX the top tab" — the tabs
         must stay reachable no matter how far any view is scrolled). Sticky
         to the TOP of the dock's own scrolling container (the document
         itself — see html/body's overflow-x rule above, which the CSS
         overflow spec's "one axis hidden forces the other to auto" rule
         turns into the actual vertical scrollport; nothing in `#app` or
         `.pane` sets its own `overflow`, so neither creates a nested
         scroll container that would defeat this). `z-index` sits above
         `.setup-preview-section` (below) so the tabs always paint on top —
         and stay clickable — if the two ever touch; `background` is opaque
         for the same reason (each `.tabs button` already paints its own
         background, but the row itself needs one too so no gap between/
         around them can let scrolled-past content show through). */
      .tabs {
        display: flex;
        border-bottom: 1px solid #2a2a2a;
        position: sticky;
        top: 0;
        z-index: 20;
        background: #1a1a1a;
      }
      .tabs button {
        flex: 1;
        min-height: 44px;
        background: #1a1a1a;
        color: #e8e8e8;
        border: none;
        border-bottom: 3px solid transparent;
        font-size: 1rem;
        cursor: pointer;
      }
      .tabs button.active {
        border-bottom-color: #4da3ff;
        background: #202020;
        font-weight: 700;
      }
      .pane {
        padding: 1rem;
      }
      .live-empty {
        padding: 2rem 1rem;
        color: #a0a0a0;
        font-size: 1.1rem;
      }
      .live-empty button.ctl {
        margin-top: 0.75rem;
      }
      /* Task 2.12 — one-card connect flow. Mirrors .settings-row's own
         input/label styling (Diagnostics' Settings section) so the two
         forms that persist through the SAME onSaveSettings path also look
         like the same feature. */
      .connect-card {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        align-items: flex-start;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        padding: 0.9rem;
        margin-top: 0.5rem;
      }
      .connect-card label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }
      .connect-card input {
        background: #0f0f0f;
        color: #e8e8e8;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
        padding: 0.35rem 0.5rem;
        min-height: 40px;
        width: 10rem;
      }
      .connect-state {
        color: #ffd699;
        font-size: 0.9rem;
      }
      /* Gate fix wave (Ruling C) — the card is no longer a wall: this line
         names what connecting actually buys, and the chip below is the
         permanent way back once "Not now" has been clicked. */
      .connect-optional-note {
        color: #a0a0a0;
        font-size: 0.85rem;
        max-width: 34rem;
      }
      button.ctl.obs-chip {
        min-height: 28px;
        min-width: 0;
        padding: 0.2rem 0.7rem;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        border-radius: 999px;
        background: #2a2a2a;
        color: #c0c0c0;
        border: 1px solid #444;
        margin-bottom: 0.6rem;
      }
      /* Gate fix wave — secondary explanatory line under a control (the
         add-overlay scan's "already exists in <scene>" note, and the
         password-free-URL note beside it). */
      .diag-note {
        color: #a0a0a0;
        font-size: 0.85rem;
        margin: 0.35rem 0;
      }
      .current-value {
        font-size: clamp(2.5rem, 14vw, 5rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
        margin: 0.25rem 0;
      }
      .progress-line {
        color: #b0b0b0;
        font-size: 0.95rem;
        margin-bottom: 0.5rem;
      }
      .status-chip {
        display: inline-block;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        margin-bottom: 0.75rem;
      }
      .status-chip[data-state='showing'] {
        background: #123a1f;
        color: #7be495;
        border: 1px solid #1f6b39;
      }
      .status-chip[data-state='hidden'] {
        background: #3a1212;
        color: #ff9a9a;
        border: 1px solid #6b1f1f;
      }
      .status-chip[data-state='unknown'] {
        background: #2a2a2a;
        color: #c0c0c0;
        border: 1px solid #444;
      }
      .action-feedback {
        min-height: 1.2rem;
        color: #7be495;
        font-size: 0.9rem;
        margin-bottom: 0.75rem;
      }
      .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }
      button.ctl {
        min-height: 44px;
        min-width: 44px;
        padding: 0.5rem 0.9rem;
        font-size: 1rem;
        background: #2a2a2a;
        color: #e8e8e8;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        cursor: pointer;
      }
      button.ctl:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button.ctl.danger {
        border-color: #6b1f1f;
      }
      /* Task 2.10 — live-view hierarchy (PRD §9, AC 23): +1/-1 get their own
         row so +1 can visually outweigh -1 (larger flex share AND a taller
         min-height — both dimensions, so the bounding-box AREA test is never
         a coin flip on one axis alone), and Reset/End get a visibly smaller,
         muted treatment so they read as separate from the operator's
         moment-to-moment counting actions. */
      .primary-row {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }
      .primary-row .ctl-primary {
        flex: 1 1 0%;
        min-height: 56px;
        font-size: 1.15rem;
        font-weight: 700;
      }
      .primary-row .ctl-primary-dominant {
        flex: 2 1 0%;
        min-height: 72px;
        font-size: 1.5rem;
      }
      .live-danger-divider {
        height: 1px;
        background: #2a2a2a;
        border: none;
        margin: 0.9rem 0 0.6rem;
      }
      .danger-row .ctl-small {
        padding: 0.3rem 0.6rem;
        font-size: 0.8rem;
        opacity: 0.75;
      }
      .jump-box,
      .confirm-box {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        padding: 0.6rem;
        margin-bottom: 0.75rem;
      }
      .jump-box input {
        background: #0f0f0f;
        color: #e8e8e8;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
        padding: 0.35rem 0.5rem;
        min-height: 32px;
        width: 6rem;
        font-size: 1rem;
      }
      .jump-error {
        color: #ff9a9a;
        font-size: 0.85rem;
        width: 100%;
      }
      .mode-row {
        margin-bottom: 0.75rem;
      }
      .auto-cluster {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
      }
      /* Task 2.6 — Setup + Presets views */
      .form-row {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        margin-bottom: 0.6rem;
      }
      /* Task 2.14 — Setup redesign: <fieldset>/<legend> groups (Counter,
         Layout, Label, Counter style, Animation, Completion) with a visible
         heading each, replacing the earlier flat field list. Reset to a
         plain block (no default fieldset border/padding/min-width — a
         default <fieldset>'s intrinsic min-width can force horizontal
         overflow at the 300 px dock width all on its own) and restyled to
         match the rest of the dark UI. */
      .setup-group {
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        margin: 0 0 0.9rem;
        padding: 0.75rem;
        min-width: 0;
      }
      .setup-group-legend {
        padding: 0 0.3rem;
        font-size: 0.8rem;
        color: #a0a0a0;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      /* PRD §9 item 2 — Start/Finish on one row, two columns. `min-width: 0`
         on each column lets a flex child shrink below its content's natural
         width instead of forcing the row (and the 300 px dock) to overflow. */
      .two-col-row {
        display: flex;
        gap: 0.5rem;
      }
      .two-col-row > .form-row {
        flex: 1 1 0%;
        min-width: 0;
      }
      .form-label {
        font-size: 0.8rem;
        color: #a0a0a0;
      }
      .form-row input[type='text'],
      .form-row input[type='number'],
      .form-row input[type='search'],
      .form-row select {
        background: #0f0f0f;
        color: #e8e8e8;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
        padding: 0.4rem 0.5rem;
        min-height: 40px;
        font-size: 1rem;
        max-width: 100%;
      }
      .form-row input[type='color'] {
        min-height: 40px;
        width: 4rem;
        padding: 0.15rem;
        background: #0f0f0f;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
      }
      .field-error {
        color: #ff9a9a;
        font-size: 0.85rem;
      }
      .field-hint {
        color: #a0a0a0;
        font-size: 0.85rem;
        margin-bottom: 0.6rem;
      }
      .range-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .range-value {
        font-size: 0.85rem;
        color: #a0a0a0;
        min-width: 4.5rem;
      }
      /* Task 2.15 (operator feedback: "add a label to the preview... fix
         the preview so no matter how the personnel scrolls, they always
         see it"). This SECTION (caption + `.setup-preview-wrap`) is the
         sticky element — never the scaled node itself: `.setup-preview-
         scale-box` below carries a `transform: scale()` (set by setup.ts's
         fitPreviewToScale()) that creates a new containing block for ITS
         OWN descendants, and stacking `position: sticky` on top of an
         already-scaled/animated node is exactly the kind of thing that
         breaks in subtle ways — keeping the scaled node an ordinary,
         un-positioned descendant of this section sidesteps that entirely.
         `top` is the tab bar's actual measured height (kept current by
         main.ts) so this sticks directly below the tabs, never under or
         overlapping them; own opaque background (matching the page, not
         `.setup-preview-wrap`'s darker one) so the rest of the scrolled-
         past form never shows through around the caption while stuck;
         `z-index` stays BELOW `.tabs` (20) per the brief ("tabs must
         remain clickable while stuck"). */
      .setup-preview-section {
        position: sticky;
        top: var(--tab-bar-height, 44px);
        z-index: 10;
        background: #121212;
        padding-bottom: 0.6rem;
      }
      .setup-preview-caption {
        font-size: 0.75rem;
        color: #a0a0a0;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 0.35rem;
      }
      .setup-preview-wrap {
        background: #0f0f0f;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        padding: 1rem;
        margin-bottom: 0.75rem;
      }
      /* Final gate wave, ruling A (F1) — the LAYOUT FOOTPRINT only: its
         height is set by setup.ts's fitPreviewToScale() to the preview's
         SCALED visual height, so the rest of the form isn't pushed down by
         the preview's unscaled size. It no longer carries the
         `transform: scale()` itself: an overflow clip applies in the
         element's OWN pre-transform coordinate space, so anything wider than
         this box's layout width was cut off however far the box was then
         scaled down — most visibly the 'Counter in front' ghost, which is
         centred on a narrow contentRoot and therefore sits mostly at
         NEGATIVE local coordinates. The transform now lives on
         `.setup-preview-scale-inner` below, which is sized to the content's
         true visual union, so this `overflow: hidden` is once again only the
         safety net it was always described as. */
      .setup-preview-scale-box {
        width: 100%;
        overflow: hidden;
      }
      /* The SCALED CONTENT (ruling A): width/height/transform are all set
         inline by fitPreviewToScale() from the measured union of the
         preview's own box and the textBehind ghost's transformed rect. */
      .setup-preview-scale-inner {
        transform-origin: top left;
      }
      /* No `word-break`/wrapping rule here on purpose (fix wave, review
         Important 2: the previous `word-break: break-word` let a long
         label WRAP inside the narrow dock while the real overlay — whose
         container is the full browser-source viewport — rendered the same
         label on one line, a genuine preview/stream lie). setup.ts forces
         `white-space: nowrap` on this element instead and scales the
         SCALE-BOX wrapper above to fit — same wrapping behaviour as the
         stream, just visually shrunk. */
      /* Final gate wave (F2) — no `font-variant-numeric` here. It was a
         leftover of the pre-2.14 single-element preview and, on the shared
         contentRoot, was inherited by the LABEL spans: a digit-bearing label
         ("24/7 club") rendered tabular in the preview and proportional on the
         stream, a divergence in exactly the surface the shared module exists
         to keep byte-identical. The one PRD-locked tabular-nums (AC 9) is set
         inline on the NUMBER node by applyPresentation(), for both
         consumers. */
      .setup-preview {
        display: inline-flex;
      }
      /* Task 2.14 — the preview's own layout (flex-direction/align-items,
         position/order/z-index for the textBehind ghost) is now applied
         INLINE by ../../shared/overlay-presentation.js's applyPresentation
         (the same function the real overlay renderer calls), not by
         per-layout CSS classes here — see setup.ts's renderPreviewBlock().
         '.setup-preview-ghost' marks the ghost node for tests
         (setup.ts's updatePreviewTestids toggles it); it restates the
         SAME opacity applyPresentation() already sets inline on this exact
         element (a harmless, redundant override — inline styles always win
         over a class) so this ruleset carries a real declaration a future
         cleanup pass won't mistake for dead/orphaned CSS and delete, which
         would silently break every spec keyed on this class existing. */
      .setup-preview-ghost {
        opacity: 0.18;
      }
      /* Task 2.11 — six-layout gallery */
      .layout-gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }
      .layout-thumb-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.3rem;
        background: #1a1a1a;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.5rem 0.6rem;
        min-width: 64px;
        min-height: 64px;
        cursor: pointer;
        color: #e8e8e8;
      }
      .layout-thumb-btn.selected {
        border-color: #4da3ff;
        background: #123a52;
      }
      .layout-thumb {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        width: 40px;
        height: 28px;
        position: relative;
      }
      .layout-thumb-row {
        flex-direction: row;
      }
      .layout-thumb-column {
        flex-direction: column;
      }
      .layout-thumb-overlap {
        display: block;
      }
      .layout-thumb-overlap .layout-thumb-bar-number {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .layout-thumb-bar {
        background: #6ab0ff;
        border-radius: 2px;
      }
      .layout-thumb-bar-label {
        width: 14px;
        height: 5px;
      }
      .layout-thumb-bar-number {
        width: 20px;
        height: 12px;
      }
      .layout-thumb-bar-ghost {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 32px;
        height: 22px;
        opacity: 0.35;
      }
      .layout-thumb-caption {
        font-size: 0.7rem;
        color: #a0a0a0;
        text-align: center;
      }
      .list-header {
        margin-bottom: 0.75rem;
      }
      .list-header input {
        width: 100%;
        background: #0f0f0f;
        color: #e8e8e8;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
        padding: 0.4rem 0.5rem;
        min-height: 40px;
      }
      .list-row {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        padding: 0.75rem;
        margin-bottom: 0.6rem;
      }
      .list-row-title {
        font-weight: 700;
        font-size: 1.05rem;
      }
      .list-row-desc {
        color: #b0b0b0;
        font-size: 0.9rem;
        margin: 0.15rem 0;
      }
      .list-row-meta {
        color: #808080;
        font-size: 0.8rem;
        margin-bottom: 0.5rem;
      }
      /* Task 2.9 — preset export/import via clipboard */
      .import-panel {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        padding: 0.6rem;
        margin-bottom: 0.75rem;
      }
      /* Task 2.10, item 4 — wraps the textarea + its Paste button so Paste
         sits directly beside the field it fills, per the brief. Higher
         specificity than the plain `.import-panel textarea` rule below (3
         classes vs. 2), so its `width: auto` reliably wins regardless of
         declaration order. */
      .import-textarea-row {
        display: flex;
        gap: 0.5rem;
        align-items: flex-start;
      }
      .import-panel .import-textarea-row textarea {
        flex: 1 1 0%;
        min-width: 0;
        width: auto;
      }
      .import-panel textarea {
        background: #0f0f0f;
        color: #e8e8e8;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
        padding: 0.5rem;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        min-height: 8rem;
        resize: vertical;
        width: 100%;
      }
      /* Task 2.8 — Diagnostics view */
      .diag-section-title {
        font-size: 0.8rem;
        color: #a0a0a0;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0.9rem 0 0.4rem;
      }
      .diag-section-title:first-child {
        margin-top: 0;
      }
      .diag-checklist {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .diag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: baseline;
        padding: 0.5rem 0.6rem;
        border-radius: 6px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        font-size: 0.9rem;
      }
      .diag-row-label {
        font-weight: 700;
        min-width: 7rem;
      }
      .diag-row[data-state='ok'] {
        border-color: #1f6b39;
      }
      .diag-row[data-state='ok'] .diag-row-text {
        color: #7be495;
      }
      .diag-row[data-state='warn'] {
        border-color: #7a4d00;
      }
      .diag-row[data-state='warn'] .diag-row-text {
        color: #ffd699;
      }
      .diag-row[data-state='fail'] {
        border-color: #6b1f1f;
      }
      .diag-row[data-state='fail'] .diag-row-text {
        color: #ff9a9a;
      }
      /* Deliberately distinct from 'ok' green — a placeholder that hasn't
         actually been verified (e.g. diag-row-hotkeys) must never read as
         a success state. Matches .status-chip[data-state='unknown']'s own
         neutral gray. */
      .diag-row[data-state='neutral'] {
        border-color: #444;
      }
      .diag-row[data-state='neutral'] .diag-row-text {
        color: #c0c0c0;
      }
      .diag-url-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.5rem;
      }
